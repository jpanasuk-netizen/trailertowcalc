<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
  <title id="t">CURT weight-carrying ratings by hitch class</title>
  <desc id="d">Class 1 up to 2,000 lb, Class 2 up to 3,500 lb, Class 3 up to 8,000 lb, Class 4 up to 10,000 lb, Class 5 Xtra Duty 16,000 to 17,000 lb.</desc>
  <rect width="720" height="250" fill="#f6f8fa"/>
  <g font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1f2328">
    <text x="36" y="32" font-size="16" font-weight="700">Weight-carrying gross, CURT class chart</text>
    <text x="36" y="68">Class 1</text>
    <rect x="110" y="54" width="60" height="18" fill="#9a3412"/>
    <text x="180" y="68">up to 2,000 lb</text>
    <text x="36" y="100">Class 2</text>
    <rect x="110" y="86" width="105" height="18" fill="#9a3412"/>
    <text x="225" y="100">up to 3,500 lb</text>
    <text x="36" y="132">Class 3</text>
    <rect x="110" y="118" width="240" height="18" fill="#9a3412"/>
    <text x="360" y="132">up to 8,000 lb</text>
    <text x="36" y="164">Class 4</text>
    <rect x="110" y="150" width="300" height="18" fill="#9a3412"/>
    <text x="420" y="164">up to 10,000 lb</text>
    <text x="36" y="204">Class 5</text>
    <text x="110" y="204">Xtra Duty 16,000-17,000 lb</text>
    <text x="36" y="236" font-size="12" fill="#57606a">Bar lengths use 2,000, 3,500, 8,000, and 10,000. Class 5 is the published range, not one bar.</text>
  </g>
</svg>
