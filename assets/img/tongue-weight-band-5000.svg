<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-labelledby="t d">
  <title id="t">Tongue-weight targets for a 5,000 lb trailer</title>
  <desc id="d">For a 5,000 pound trailer the calculator returns 500 lb at 10 percent, 600 lb at 12 percent, and 750 lb at 15 percent. The track runs from 0 to 20 percent.</desc>
  <rect width="720" height="200" fill="#f6f8fa"/>
  <g font-family="system-ui,Segoe UI,sans-serif" fill="#1f2328">
    <text x="36" y="36" font-size="16" font-weight="700">5,000 lb loaded trailer</text>
    <rect x="40" y="78" width="640" height="28" rx="6" fill="#eaeef2" stroke="#d0d7de"/>
    <rect x="360" y="78" width="160" height="28" fill="#dafbe1" stroke="#1a7f37"/>
    <g font-size="13">
      <line x1="360" y1="70" x2="360" y2="114" stroke="#1f2328"/>
      <text x="360" y="136" text-anchor="middle">10%</text>
      <text x="360" y="154" text-anchor="middle" font-weight="700">500 lb</text>
      <line x1="424" y1="70" x2="424" y2="114" stroke="#9a3412"/>
      <text x="424" y="136" text-anchor="middle">12%</text>
      <text x="424" y="154" text-anchor="middle" font-weight="700">600 lb</text>
      <line x1="520" y1="70" x2="520" y2="114" stroke="#1f2328"/>
      <text x="520" y="136" text-anchor="middle">15%</text>
      <text x="520" y="154" text-anchor="middle" font-weight="700">750 lb</text>
    </g>
    <text x="36" y="184" font-size="12" fill="#57606a">Track is 0-20%. Green is 10-15%. 12% is this calculator's midpoint of that band.</text>
  </g>
</svg>
