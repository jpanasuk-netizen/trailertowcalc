<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="t d">
  <title id="t">CAT Scale platform order for a standard trailer</title>
  <desc id="d">Platform 1 is the steer axle, platform 2 is the drive axle, and platform 3 is the trailer axle.</desc>
  <rect width="720" height="180" fill="#f6f8fa"/>
  <g font-family="system-ui,Segoe UI,sans-serif" fill="#1f2328" text-anchor="middle">
    <rect x="36" y="48" width="200" height="72" rx="8" fill="#fff" stroke="#9a3412" stroke-width="2"/>
    <text x="136" y="78" font-size="15" font-weight="700">Platform 1</text>
    <text x="136" y="100" font-size="14">Steer axle</text>
    <rect x="256" y="48" width="200" height="72" rx="8" fill="#fff" stroke="#9a3412" stroke-width="2"/>
    <text x="356" y="78" font-size="15" font-weight="700">Platform 2</text>
    <text x="356" y="100" font-size="14">Drive axle</text>
    <rect x="476" y="48" width="200" height="72" rx="8" fill="#fff" stroke="#9a3412" stroke-width="2"/>
    <text x="576" y="78" font-size="15" font-weight="700">Platform 3</text>
    <text x="576" y="100" font-size="14">Trailer axle</text>
    <text x="360" y="156" font-size="13" fill="#57606a">Standard trailer, all three on the scale at once</text>
  </g>
</svg>
